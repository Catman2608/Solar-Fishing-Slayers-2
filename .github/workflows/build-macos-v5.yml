name: Build macOS DMG

on:
    workflow_dispatch:

jobs:
    build-mac:
        runs-on: macos-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@main

            - name: Set up Python
              uses: actions/setup-python@main
              with:
                  python-version: "3.14"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install pywebview numpy mss pynput requests opencv-python pyinstaller

            - name: Build with PyInstaller
              run: |
                  pyinstaller --onedir --windowed --icon="icon.icns" --strip "main.py"

            - name: Check dist contents
              run: |
                  ls -lh dist
                  echo "Contents of dist:"
                  ls -la dist/
                  ls -la dist/main

            - name: Create DMG from .app bundle
              run: |
                  APP_PATH=$(find dist -name "*.app" -type d | head -n 1)
                  echo "Found app at: $APP_PATH"
                  
                  hdiutil create \
                    -volname "main" \
                    -srcfolder "$APP_PATH" \
                    -ov \
                    -format UDZO \
                    main.dmg
                  
                  echo "DMG created:"
                  ls -lh main.dmg

            - name: Upload DMG artifact
              uses: actions/upload-artifact@v4
              with:
                  name: main-macOS
                  path: main.dmg