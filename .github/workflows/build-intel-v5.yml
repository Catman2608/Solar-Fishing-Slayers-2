name: Build macOS DMG (Intel)

on:
  workflow_dispatch:

jobs:
    build-mac:
      runs-on: macos-15-intel

      steps:
        - name: Checkout repo
          uses: actions/checkout@main

        - name: Set up Python
          uses: actions/setup-python@main
          with:
            python-version: "3.14"

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install pywebview numpy mss pynput requests opencv-python pyinstaller

        - name: Build with PyInstaller
          run: |
            pyinstaller \
              --onedir \
              --windowed \
              --icon="icon.icns" \
              --strip \
              --target-architecture=x86_64 \
              "main.py"

        - name: Check dist contents
          run: |
            ls -lh dist
            echo "Contents of dist:"
            ls -la dist/
            ls -la dist/main

        - name: Create DMG from .app bundle
          run: |
            APP_PATH=$(find dist -name "*.app" -type d | head -n 1)
            echo "Found app at: $APP_PATH"

            hdiutil create \
              -volname "main" \
              -srcfolder "$APP_PATH" \
              -ov \
              -format UDZO \
              main.dmg

            echo "DMG created:"
            ls -lh main.dmg

        - name: Upload DMG artifact
          uses: actions/upload-artifact@v4
          with:
            name: main-macOS-Intel
            path: main.dmg